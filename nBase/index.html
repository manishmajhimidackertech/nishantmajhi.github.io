<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>nBase</title>

    <link rel="stylesheet" href="./css/colors.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <script src="script.js"></script>
  </head>
  <body>
    <main>
      <h1>MultiBase Calculator</h1>
      <section id="first_num">
        <select title="Number system for the first number">
          <option value="2">Binary</option>
          <option value="5">Quinary</option>
          <option value="8">Octal</option>
          <option value="10" selected>Decimal</option>
          <option value="16">Hex</option>
        </select>
        <input
          type="text"
          placeholder="Enter first number"
          minlength="1"
          maxlength="24"
          autocomplete="off"
          autofocus
        />
      </section>
      <section id="second_num">
        <select title="Number system for the second number">
          <option value="2">Binary</option>
          <option value="5">Quinary</option>
          <option value="8">Octal</option>
          <option value="10" selected>Decimal</option>
          <option value="16">Hex</option>
        </select>
        <input
          type="text"
          placeholder="Enter second number"
          minlength="1"
          maxlength="24"
          autocomplete="off"
        />
      </section>
      <section id="operations">
        <select title="Number system for the result">
          <option value="2">Binary</option>
          <option value="5">Quinary</option>
          <option value="8">Octal</option>
          <option value="10" selected>Decimal</option>
          <option value="16">Hex</option>
        </select>
        <span>
          <button type="button" data-operator="+">+</button>
          <button type="button" data-operator="-">−</button>
          <button type="button" data-operator="*">×</button>
          <button type="button" data-operator="/">÷</button>
        </span>
      </section>
      <output>
        <!-- Dynamically generated by JS -->
      </output>
    </main>
  </body>
</html>
