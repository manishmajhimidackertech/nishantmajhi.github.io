<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon" />
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

<!-- SEO: Primary Meta Tags -->
<meta name="title" content="{{ page.title | default: site.title }}" />
<meta name="description" content="{{ site.description }}" />
<meta name="author" content="Manish Majhi" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<!-- SEO: Open Graph (Facebook, LinkedIn, WhatsApp) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ site.description }}" />

<!-- SEO: Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:url" content="{{ site.url }}{{ page.url }}" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ site.description }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

<nav class="site-nav">
  <div class="brand"><span class="path">~/manish-majhi/projects</span> $ <span id="typed"></span><span class="cursor">&nbsp;</span></div>
  <div class="links">
    <a href="#featured">Featured</a>
    <a href="#index">Index</a>
    <a class="resume" href="{{ '/Resume/Manish_Majhi-Resume.pdf' | relative_url }}" download>Download Resume</a>
  </div>
</nav>

<div class="wrap">
  {{ content }}

  <footer>
    <div class="note">Balance carried forward.</div>
    <div class="links">
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="#">LinkedIn</a>
    </div>
  </footer>
</div>

<script>
  const text = "whoami";
  const el = document.getElementById('typed');
  let i = 0;
  function type(){
    if(i <= text.length){
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(type, 90);
    }
  }
  type();
</script>

</body>
</html>
