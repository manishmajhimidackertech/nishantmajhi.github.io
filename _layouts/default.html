<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1535d4" />
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon" />
<title>{{ page.title | default: site.title }}</title>

<!-- SEO: Primary Meta Tags -->
<meta name="title" content="{{ page.title | default: site.title }}" />
<meta name="description" content="{{ site.description }}" />
<meta name="author" content="Manish Majhi" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<!-- SEO: Open Graph (Facebook, LinkedIn, WhatsApp) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ site.description }}" />

<!-- SEO: Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:url" content="{{ site.url }}{{ page.url }}" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ site.description }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>

<nav class="site-nav" aria-label="Site">
  <a class="mark" href="#top" aria-label="Top">MM</a>
  <a href="#work">Work</a>
  <a href="#index">Index</a>
  <a href="#path">Path</a>
  <a href="#contact">Contact</a>
  <a class="resume" href="{{ '/Resume/Manish_Majhi-Resume.pdf' | relative_url }}" download>Résumé ↓</a>
</nav>

<main>
{{ content }}
</main>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
